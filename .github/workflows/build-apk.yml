name: Build Debug APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: |
        echo "========== 开始构建 =========="
        ./gradlew assembleDebug --stacktrace --info || {
          echo ""
          echo "========== 构建失败，以下是关键错误 =========="
          grep -n -E "error:|error\]|cannot find symbol|package .* does not exist|incompatible types|BUILD FAILED" --color=always || true
          echo "========== 错误结束 =========="
          exit 1
        }

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
