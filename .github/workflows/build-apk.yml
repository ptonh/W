name: Build Debug APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Configure Gradle to use Aliyun mirror
      run: |
        mkdir -p ~/.gradle
        cat > ~/.gradle/init.gradle << 'EOF'
        allprojects {
            buildscript {
                repositories {
                    maven { url 'https://maven.aliyun.com/repository/public' }
                    maven { url 'https://maven.aliyun.com/repository/google' }
                    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                    google()
                    mavenCentral()
                }
            }
            repositories {
                maven { url 'https://maven.aliyun.com/repository/public' }
                maven { url 'https://maven.aliyun.com/repository/google' }
                maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                google()
                mavenCentral()
            }
        }
        EOF

    - name: Build with Gradle
      run: |
        echo "========== 开始构建 =========="
        ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
        BUILD_EXIT=${PIPESTATUS[0]}

        if [ $BUILD_EXIT -ne 0 ]; then
          echo ""
          echo "==================== 构建失败 - 错误信息开始 ===================="
          echo ""
          
          # 提取真正的错误（去掉大量下载日志）
          grep -E "error:|error\]|cannot find symbol|package .* does not exist|incompatible types|Could not resolve|Too Many Requests|BUILD FAILED|Execution failed|What went wrong" build.log | head -50
          
          echo ""
          echo "==================== 错误信息结束（可直接复制上面内容） ===================="
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
